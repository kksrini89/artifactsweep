[package]
name = "artifactsweep"
version = "0.2.2"
edition = "2024"
rust-version = "1.97"
description = "Cross-platform CLI for scanning and cleaning generated development artifacts to reclaim disk space."
readme = "README.md"
keywords = [
    "artifactsweep",
    "artifact",
    "sweep",
    "clean",
    "scan",
    "junk",
    "delete",
    "cli"
]
categories = ["command-line-interface"]
license = "MIT"
repository = "https://github.com/kksrini89/artifactsweep"

[[bin]]
name = "sweep"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
human_bytes = "0.4.3"
indicatif = "0.18.6"
rayon = "1.12.0"
walkdir = "2.5.0"
