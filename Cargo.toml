[package]
name = "dev-clean"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "disk clean-up utility for developers, not a file deletion tool."
readme = "README.md"
keywords = [
    "clean",
    "scan",
    "junk",
    "delete",
    "cli"
]
categories = ["command-line-interface"]
license = "MIT"
repository = "https://github.com/kksrini89/dev-clean"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
human_bytes = "0.4.3"
indicatif = "0.18.6"
rayon = "1.12.0"
walkdir = "2.5.0"
