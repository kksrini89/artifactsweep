[package]
name = "artifactsweep-cli"
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
description = "CLI for ArtifactSweep"
license = "MIT"

[[bin]]
name = "sweep"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
artifactsweep-core = { path = "../artifactsweep-core" }