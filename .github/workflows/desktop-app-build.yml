# Desktop app smoke build (no GitHub Release)
# Builds CLI + Tauri installers on demand / branch pushes

name: desktop-app-build

on:
  push:
    branches:
      - main
      - feat/desktop-app
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis
            staged_name: sweep-x86_64-pc-windows-msvc.exe
            desktop_glob: target/release/bundle/nsis/*-setup.exe

          - name: linux-x64
            os: ubuntu-latest
            bundles: deb
            staged_name: sweep-x86_64-unknown-linux-gnu
            desktop_glob: target/release/bundle/deb/*.deb

          - name: macos-aarch64
            os: macos-latest
            bundles: dmg
            staged_name: sweep-aarch64-apple-darwin
            desktop_glob: target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux packages (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build CLI (release)
        run: cargo build -p artifactsweep-cli --release

      - name: Smoke-test CLI
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/sweep.exe --help
          else
            ./target/release/sweep --help
          fi

      - name: Stage CLI for Tauri externalBin
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/sweep.exe "apps/desktop/src-tauri/binaries/${{ matrix.staged_name }}"
          else
            cp target/release/sweep "apps/desktop/src-tauri/binaries/${{ matrix.staged_name }}"
            chmod +x "apps/desktop/src-tauri/binaries/${{ matrix.staged_name }}"
          fi
          ls -la apps/desktop/src-tauri/binaries/

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop installer
        working-directory: apps/desktop
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.desktop_glob }}
          if-no-files-found: error
