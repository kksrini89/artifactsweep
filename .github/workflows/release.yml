# CLI-only release on version tags (original style)

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: sweep-linux-x86_64
            binary_path: target/release/sweep

          - os: windows-latest
            asset_name: sweep-windows-x86_64.exe
            binary_path: target/release/sweep.exe

          - os: macos-latest
            asset_name: sweep-macos
            binary_path: target/release/sweep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build -p artifactsweep-cli --release

      - name: Smoke test --help
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/sweep.exe --help
          else
            ./target/release/sweep --help
          fi

      - name: Stage asset (Unix)
        if: runner.os != 'Windows'
        run: cp "${{ matrix.binary_path }}" "${{ matrix.asset_name }}"

      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "${{ matrix.binary_path }}" "${{ matrix.asset_name }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
