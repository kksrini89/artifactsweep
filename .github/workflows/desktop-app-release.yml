# Desktop app + standalone CLI → GitHub Release on version tags
#
# Platforms (v1):
#   - Windows x64  → NSIS setup.exe  + sweep.exe (User PATH via installer hooks)
#   - Linux x64    → .deb            + standalone CLI asset
#   - macOS ARM    → .dmg            + standalone CLI asset
#
#   git tag v0.2.2 && git push origin v0.2.2

name: desktop-app-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis
            staged_name: sweep-x86_64-pc-windows-msvc.exe
            desktop_glob: target/release/bundle/nsis/*-setup.exe
            cli_asset: sweep-x86_64-pc-windows-msvc.exe

          - name: linux-x64
            os: ubuntu-latest
            bundles: deb
            staged_name: sweep-x86_64-unknown-linux-gnu
            desktop_glob: target/release/bundle/deb/*.deb
            cli_asset: sweep-x86_64-unknown-linux-gnu

          - name: macos-aarch64
            os: macos-latest
            bundles: dmg
            staged_name: sweep-aarch64-apple-darwin
            desktop_glob: target/release/bundle/dmg/*.dmg
            cli_asset: sweep-aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux packages (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build CLI (release)
        run: cargo build -p artifactsweep-cli --release

      - name: Smoke-test CLI
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/sweep.exe --help
          else
            ./target/release/sweep --help
          fi

      - name: Stage CLI for Tauri externalBin
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/sweep.exe "apps/desktop/src-tauri/binaries/${{ matrix.staged_name }}"
          else
            cp target/release/sweep "apps/desktop/src-tauri/binaries/${{ matrix.staged_name }}"
            chmod +x "apps/desktop/src-tauri/binaries/${{ matrix.staged_name }}"
          fi
          ls -la apps/desktop/src-tauri/binaries/

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop installer
        working-directory: apps/desktop
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p dist-release
          shopt -s nullglob
          for f in ${{ matrix.desktop_glob }}; do
            echo "Staging desktop: $f"
            cp "$f" dist-release/
          done
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/sweep.exe "dist-release/${{ matrix.cli_asset }}"
          else
            cp target/release/sweep "dist-release/${{ matrix.cli_asset }}"
          fi
          ls -la dist-release/

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CI artifacts (non-tag / workflow_dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error
