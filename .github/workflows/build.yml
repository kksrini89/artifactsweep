# CLI smoke build on main / manual dispatch (original)

name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: sweep-linux-x86_64
            binary_path: target/release/sweep

          - os: windows-latest
            artifact_name: sweep-windows-x86_64
            binary_path: target/release/sweep.exe

          - os: macos-latest
            artifact_name: sweep-macos
            binary_path: target/release/sweep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build -p artifactsweep-cli --release

      - name: Smoke test --help
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/sweep.exe --help
          else
            ./target/release/sweep --help
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
