# build.yml — multi-OS release *build* (artifacts only, no GitHub Release yet)
#
# Triggers:
#   - push to main
#   - manual "Run workflow" in the Actions tab
#
# Matrix: Windows, Linux, macOS in parallel

name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:   # Run workflow button on GitHub

# Don't cancel other OS jobs if one fails (optional; helps see all results)
jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: dev-clean-linux-x86_64
            binary_path: target/release/sweep

          - os: windows-latest
            artifact_name: dev-clean-windows-x86_64
            binary_path: target/release/sweep.exe

          - os: macos-latest
            artifact_name: dev-clean-macos
            binary_path: target/release/sweep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Smoke test --help
        run: ${{ matrix.binary_path }} --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error